<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Italo Freitas Makeup</title>
    <script type="text/javascript">
      // Single Page Apps para GitHub Pages
      // Este script verifica se houve um erro 404 e redireciona para a página principal
      // mantendo a rota original no histórico, permitindo que o React Router/Wouter
      // carregue a página correta.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
